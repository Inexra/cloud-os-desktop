name: Build FeviOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - '.github/workflows/build-iso.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: fevios-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bootable Debian Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out FeviOS
        uses: actions/checkout@v4

      - name: Verify Docker is available
        run: docker info

      - name: Download official Google Chrome stable package
        run: |
          mkdir -p config/packages.chroot
          curl --fail --location --retry 3 \
            "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb" \
            --output config/packages.chroot/google-chrome_amd64.deb
          test -s config/packages.chroot/google-chrome_amd64.deb
          ls -lh config/packages.chroot/google-chrome_amd64.deb

      - name: Download official BlueJ Debian package
        run: |
          mkdir -p config/packages.chroot
          curl --fail --location --retry 3 \
            "https://github.com/k-pet-group/BlueJ-Greenfoot/releases/download/BLUEJ-RELEASE-6.0.1/BlueJ-linux-x64-6.0.1.deb" \
            --output config/packages.chroot/bluej_amd64.deb
          test -s config/packages.chroot/bluej_amd64.deb
          ls -lh config/packages.chroot/bluej_amd64.deb

      - name: Download WordCraft and DeckCraft Linux packages
        run: |
          mkdir -p config/packages.chroot
          curl --fail --location --retry 3 \
            "https://github.com/storytold/wordcraft/releases/download/v0.8.0/wordcraft-0.8.0-linux-x86_64.deb" \
            --output config/packages.chroot/wordcraft_amd64.deb
          curl --fail --location --retry 3 \
            "https://github.com/storytold/deckcraft/releases/download/v0.8.0/deckcraft-0.8.0-linux-x86_64.deb" \
            --output config/packages.chroot/deckcraft_amd64.deb
          test -s config/packages.chroot/wordcraft_amd64.deb
          test -s config/packages.chroot/deckcraft_amd64.deb
          ls -lh config/packages.chroot/wordcraft_amd64.deb config/packages.chroot/deckcraft_amd64.deb

      - name: Build FeviOS with Debian Trixie live-build
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/build-fevios-inside-container.sh <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            gnupg ca-certificates curl debian-archive-keyring

          echo "live-build version:"
          lb --version
          echo "debootstrap version:"
          debootstrap --version

          lb config \
            --distribution trixie \
            --linux-packages linux-image-amd64 \
            --debootstrap-options "--include=gnupg" \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-chroot "http://deb.debian.org/debian" \
            --mirror-chroot-security "http://security.debian.org/debian-security" \
            --mirror-binary "http://deb.debian.org/debian" \
            --mirror-binary-security "http://security.debian.org/debian-security" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --debian-installer live \
            --bootappend-live "boot=live components username=fevi hostname=fevios locales=en_US.UTF-8 keyboard-layouts=us" \
            --apt-recommends true \
            --apt-secure true \
            --firmware-chroot true \
            --firmware-binary true

          chmod +x config/hooks/normal/0200-fevios-branding.hook.chroot
          lb build 2>&1 | tee build.log
          BUILD_SCRIPT

          docker run --privileged --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            debian:trixie \
            bash .github/build-fevios-inside-container.sh

      - name: Locate and validate ISO
        id: iso
        if: success()
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -printf '%f\n' | head -n 1)"
          if [ -z "$ISO" ]; then
            echo "No ISO was generated."
            tail -n 150 build.log || true
            exit 1
          fi
          test -s "$ISO"
          echo "path=$ISO" >> "$GITHUB_OUTPUT"
          echo "Built ISO: $ISO"
          ls -lh "$ISO"

      - name: Upload FeviOS ISO artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FeviOS-ISO
          path: ${{ steps.iso.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FeviOS-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
