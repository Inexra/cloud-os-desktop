name: Build FeviOS Lite ISO

on:
  workflow_dispatch:
  push:
    branches: [fevios-lite]
    paths:
      - 'config/**'
      - '.github/workflows/build-iso.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: fevios-lite-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build minimal Debian Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out FeviOS Lite
        uses: actions/checkout@v4

      - name: Verify build tools
        run: docker info

      - name: Build minimal Debian Trixie live image
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > .github/build-fevios-lite-inside-container.sh <<'BUILD_SCRIPT'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update
          apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso \
            gnupg ca-certificates curl debian-archive-keyring

          lb --version
          debootstrap --version

          lb config \
            --distribution trixie \
            --linux-packages linux-image \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-chroot "http://deb.debian.org/debian" \
            --mirror-chroot-security "http://security.debian.org/debian-security" \
            --mirror-binary "http://deb.debian.org/debian" \
            --mirror-binary-security "http://security.debian.org/debian-security" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --debian-installer false \
            --bootappend-live "boot=live components username=fevi hostname=fevios-lite locales=en_US.UTF-8 keyboard-layouts=us" \
            --apt-recommends false \
            --apt-secure true \
            --firmware-chroot true \
            --firmware-binary true

          chmod +x config/hooks/normal/0200-fevios-branding.hook.chroot
          lb build 2>&1 | tee build.log
          BUILD_SCRIPT

          docker run --privileged --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            debian:trixie \
            bash .github/build-fevios-lite-inside-container.sh

      - name: Locate and validate ISO
        id: iso
        if: success()
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -printf '%f\n' | head -n 1)"
          if [ -z "$ISO" ]; then
            echo "No ISO was generated."
            tail -n 150 build.log || true
            exit 1
          fi
          test -s "$ISO"
          echo "path=$ISO" >> "$GITHUB_OUTPUT"
          echo "Built ISO: $ISO"
          ls -lh "$ISO"

      - name: Upload FeviOS Lite ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FeviOS-Lite-ISO
          path: ${{ steps.iso.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FeviOS-Lite-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
