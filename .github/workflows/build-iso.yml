name: Build FeviOS ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/**'
      - '.github/workflows/build-iso.yml'
      - 'README.md'

permissions:
  contents: read

concurrency:
  group: fevios-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bootable Debian Live ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out FeviOS
        uses: actions/checkout@v4

      - name: Install image-building tools
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap squashfs-tools xorriso

      - name: Fix live-build Debian Contents index path
        run: |
          # Debian publishes Contents indexes inside each component directory.
          # The Ubuntu-packaged live-build script incorrectly requests them at dists/<suite>/.
          sudo grep -RIl 'dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz' /usr/lib/live/build | while read -r file; do
            sudo sed -i 's#dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz#dists/${LB_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g' "$file"
          done
          sudo grep -RIl 'dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz' /usr/lib/live/build | while read -r file; do
            sudo sed -i 's#dists/${LB_PARENT_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz#dists/${LB_PARENT_DISTRIBUTION}/main/Contents-${LB_ARCHITECTURES}.gz#g' "$file"
          done
          if sudo grep -R 'dists/${LB_DISTRIBUTION}/Contents-${LB_ARCHITECTURES}.gz' /usr/lib/live/build; then
            echo 'The live-build Contents URL patch did not apply.'
            exit 1
          fi

      - name: Download official Google Chrome stable package
        run: |
          mkdir -p config/packages.chroot
          curl --fail --location --retry 3 \
            "https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb" \
            --output config/packages.chroot/google-chrome_amd64.deb
          test -s config/packages.chroot/google-chrome_amd64.deb
          ls -lh config/packages.chroot/google-chrome_amd64.deb

      - name: Download official BlueJ Debian package
        run: |
          mkdir -p config/packages.chroot
          curl --fail --location --retry 3 \
            "https://github.com/k-pet-group/BlueJ-Greenfoot/releases/download/BLUEJ-RELEASE-6.0.1/BlueJ-linux-x64-6.0.1.deb" \
            --output config/packages.chroot/bluej_amd64.deb
          test -s config/packages.chroot/bluej_amd64.deb
          ls -lh config/packages.chroot/bluej_amd64.deb

      - name: Download WordCraft and DeckCraft Linux packages
        run: |
          mkdir -p config/packages.chroot
          curl --fail --location --retry 3 \
            "https://github.com/storytold/wordcraft/releases/download/v0.8.0/wordcraft-0.8.0-linux-x86_64.deb" \
            --output config/packages.chroot/wordcraft_amd64.deb
          curl --fail --location --retry 3 \
            "https://github.com/storytold/deckcraft/releases/download/v0.8.0/deckcraft-0.8.0-linux-x86_64.deb" \
            --output config/packages.chroot/deckcraft_amd64.deb
          test -s config/packages.chroot/wordcraft_amd64.deb
          test -s config/packages.chroot/deckcraft_amd64.deb
          ls -lh config/packages.chroot/wordcraft_amd64.deb config/packages.chroot/deckcraft_amd64.deb

      - name: Configure Debian Live image
        run: |
          lb config \
            --distribution trixie \
            --linux-packages linux-image-amd64 \
            --bootstrap-options "--include=gnupg" \
            --mirror-bootstrap "http://deb.debian.org/debian" \
            --mirror-chroot "http://deb.debian.org/debian" \
            --mirror-chroot-security "http://security.debian.org/debian-security" \
            --mirror-binary "http://deb.debian.org/debian" \
            --mirror-binary-security "http://security.debian.org/debian-security" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --binary-images iso-hybrid \
            --debian-installer live \
            --bootappend-live "boot=live components username=fevi hostname=fevios locales=en_US.UTF-8 keyboard-layouts=us" \
            --apt-recommends true \
            --firmware-chroot true \
            --firmware-binary true

      - name: Prepare custom hook
        run: chmod +x config/hooks/normal/0200-fevios-branding.hook.chroot

      - name: Build FeviOS
        run: |
          set -o pipefail
          sudo lb build 2>&1 | tee build.log
        shell: bash

      - name: Locate and validate ISO
        id: iso
        run: |
          ISO="$(find . -maxdepth 1 -type f -name '*.iso' -printf '%f\n' | head -n 1)"
          if [ -z "$ISO" ]; then
            echo "No ISO was generated."
            tail -n 150 build.log || true
            exit 1
          fi
          test -s "$ISO"
          echo "path=$ISO" >> "$GITHUB_OUTPUT"
          echo "Built ISO: $ISO"
          ls -lh "$ISO"

      - name: Upload FeviOS ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: FeviOS-ISO
          path: ${{ steps.iso.outputs.path }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FeviOS-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
